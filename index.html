<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>今天也要元气满满！</title>
  <style>
    :root {
      --red: #f16c59;
      --yellow: #ffd45c;
      --blue: #69b9e7;
      --green: #79c99a;
      --ink: #34343d;
      --muted: #88858a;
      --paper: #fffdf7;
      --line: #eee5d6;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 32px 16px;
      color: var(--ink);
      font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
      background-color: #fff8e9;
      background-image: radial-gradient(#efdfc7 1px, transparent 1px);
      background-size: 19px 19px;
    }

    button, input, select { font: inherit; }

    .app {
      width: min(100%, 620px);
      margin: 0 auto;
    }

    .header {
      margin-bottom: 20px;
      text-align: center;
    }

    .eyebrow {
      display: inline-block;
      margin-bottom: 10px;
      padding: 6px 13px;
      border: 2px dashed #eebc46;
      border-radius: 999px;
      color: #936d19;
      background: #fff0b8;
      font-size: 13px;
      transform: rotate(-2deg);
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 7vw, 42px);
      letter-spacing: 2px;
    }

    .subtitle {
      margin: 9px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .card {
      padding: 24px;
      border: 3px solid var(--ink);
      border-radius: 24px 20px 25px 19px;
      background: var(--paper);
      box-shadow: 7px 7px 0 var(--ink);
    }

    .date-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 18px;
      border-bottom: 2px dashed var(--line);
    }

    .date-label {
      color: var(--muted);
      font-size: 13px;
    }

    .date {
      margin-top: 5px;
      font-size: 18px;
      font-weight: 800;
    }

    .sticker {
      display: grid;
      width: 54px;
      height: 54px;
      place-items: center;
      border: 2px solid var(--ink);
      border-radius: 17px 13px 18px 14px;
      background: var(--yellow);
      font-size: 27px;
      transform: rotate(5deg);
    }

    .progress-box {
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 20px 0;
      padding: 15px;
      border: 2px solid #e8dfcf;
      border-radius: 17px;
      background: #fff9e9;
    }

    .progress-track {
      height: 17px;
      flex: 1;
      overflow: hidden;
      border: 2px solid var(--ink);
      border-radius: 999px;
      background: white;
    }

    .progress-fill {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: repeating-linear-gradient(
        135deg,
        var(--yellow),
        var(--yellow) 10px,
        #ffe58b 10px,
        #ffe58b 19px
      );
      transition: width .3s ease;
    }

    .progress-text {
      min-width: 72px;
      font-size: 14px;
      font-weight: 800;
      text-align: right;
    }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 22px 0 12px;
      font-size: 17px;
      font-weight: 800;
    }

    .section-title small {
      color: var(--muted);
      font-size: 12px;
      font-weight: 400;
    }

    .task-list {
      display: grid;
      gap: 10px;
      padding: 0;
      margin: 0;
      list-style: none;
    }

    .task {
      display: flex;
      align-items: center;
      gap: 11px;
      min-height: 57px;
      padding: 10px 12px;
      border: 2px solid var(--line);
      border-radius: 15px 12px 16px 13px;
      background: white;
      transition: .2s ease;
    }

    .task:hover { transform: translateY(-1px) rotate(-.2deg); }

    .task.done {
      border-color: #a8dcb8;
      background: #effaf1;
    }

    .check {
      display: grid;
      width: 27px;
      height: 27px;
      flex: 0 0 27px;
      place-items: center;
      padding: 0;
      border: 2px solid #c9c3b8;
      border-radius: 9px;
      color: white;
      background: white;
      cursor: pointer;
    }

    .task.done .check {
      border-color: var(--green);
      background: var(--green);
    }

    .task-name {
      min-width: 0;
      flex: 1;
      overflow-wrap: anywhere;
      font-size: 14px;
    }

    .task.done .task-name {
      color: #898f88;
      text-decoration: line-through;
    }

    .tag {
      flex: 0 0 auto;
      padding: 4px 8px;
      border-radius: 999px;
      background: #eaf5ff;
      color: #4488ae;
      font-size: 11px;
    }

    .tag[data-category="生活"] { background: #fff2d1; color: #967424; }
    .tag[data-category="运动"] { background: #e7f7eb; color: #438b57; }
    .tag[data-category="其他"] { background: #f3eafe; color: #8660aa; }

    .delete {
      width: 29px;
      height: 29px;
      flex: 0 0 29px;
      padding: 0;
      border: 0;
      border-radius: 9px;
      color: #aaa;
      background: transparent;
      cursor: pointer;
      font-size: 18px;
    }

    .delete:hover { color: #c64f45; background: #fff0ed; }

    .empty {
      padding: 25px 12px;
      border: 2px dashed #e8dfcf;
      border-radius: 15px;
      color: var(--muted);
      text-align: center;
      font-size: 14px;
    }

    .add-form {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      gap: 8px;
      margin-top: 14px;
    }

    .add-form input, .add-form select {
      min-width: 0;
      height: 44px;
      padding: 0 11px;
      border: 2px solid #e8dfcf;
      border-radius: 12px;
      outline: none;
      background: white;
    }

    .add-form input:focus, .add-form select:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px #69b9e733;
    }

    .add-button {
      height: 44px;
      padding: 0 15px;
      border: 2px solid var(--ink);
      border-radius: 12px 10px 13px 11px;
      color: white;
      background: var(--red);
      box-shadow: 3px 3px 0 var(--ink);
      cursor: pointer;
      font-weight: 800;
      white-space: nowrap;
    }

    .add-button:hover { background: #e65d4b; }
    .add-button:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }

    .cheer {
      margin: 18px 0 0;
      padding: 12px;
      border-radius: 13px;
      background: #eaf6ff;
      color: #477995;
      text-align: center;
      font-size: 13px;
    }

    .footer {
      margin-top: 15px;
      color: #958c7e;
      text-align: center;
      font-size: 12px;
    }

    @media (max-width: 480px) {
      body { padding: 22px 12px; }
      .card { padding: 17px; box-shadow: 5px 5px 0 var(--ink); }
      .add-form { grid-template-columns: minmax(0, 1fr) auto; }
      .add-form select { grid-column: 1; }
      .add-button { grid-column: 2; grid-row: 1 / span 2; height: auto; }
      .tag { display: none; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="header">
      <div class="eyebrow">☀️ 今日份的小目标</div>
      <h1>今天也要元气满满！</h1>
      <p class="subtitle">一点一点完成，也很了不起。</p>
    </header>

    <section class="card">
      <div class="date-row">
        <div>
          <div class="date-label">今天是</div>
          <div class="date" id="today"></div>
        </div>
        <div class="sticker" aria-hidden="true">⭐</div>
      </div>

      <div class="progress-box">
        <div class="progress-track" aria-label="今日完成进度">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="progress-text" id="progressText">0 / 0</div>
      </div>

      <div class="section-title">
        <span>我的打卡清单</span>
        <small>完成一项就点一下 ✓</small>
      </div>

      <ul class="task-list" id="taskList"></ul>

      <form class="add-form" id="addForm">
        <input id="taskInput" type="text" maxlength="60"
               placeholder="添加一个想完成的小任务…" required>
        <select id="categorySelect" aria-label="任务分类">
          <option>学习</option>
          <option>生活</option>
          <option>运动</option>
          <option>其他</option>
        </select>
        <button class="add-button" type="submit">＋ 添加</button>
      </form>

      <p class="cheer" id="cheer">把想做的事情写下来，今天就从一小步开始吧！</p>
    </section>

    <div class="footer">你的任务和打卡记录保存在当前浏览器中</div>
  </main>

  <script>
    const TASKS_KEY = "cute-checkin-tasks-v1";
    const RECORDS_KEY = "cute-checkin-records-v1";

    const defaultTasks = [
      { id: "sample-1", name: "喝一杯水", category: "生活" },
      { id: "sample-2", name: "阅读 10 分钟", category: "学习" },
      { id: "sample-3", name: "活动一下身体", category: "运动" }
    ];

    let tasks = JSON.parse(localStorage.getItem(TASKS_KEY) || "null") || defaultTasks;
    let records = JSON.parse(localStorage.getItem(RECORDS_KEY) || "{}");

    const list = document.getElementById("taskList");
    const today = new Date();
    const dateKey = [
      today.getFullYear(),
      String(today.getMonth() + 1).padStart(2, "0"),
      String(today.getDate()).padStart(2, "0")
    ].join("-");
    const completed = new Set(records[dateKey] || []);

    document.getElementById("today").textContent =
      new Intl.DateTimeFormat("zh-CN", {
        year: "numeric", month: "long", day: "numeric", weekday: "long"
      }).format(today);

    function save() {
      localStorage.setItem(TASKS_KEY, JSON.stringify(tasks));
      records[dateKey] = [...completed];
      localStorage.setItem(RECORDS_KEY, JSON.stringify(records));
    }

    function render() {
      list.innerHTML = "";

      if (tasks.length === 0) {
        const empty = document.createElement("li");
        empty.className = "empty";
        empty.textContent = "清单还是空的，添加一个小目标吧！";
        list.appendChild(empty);
      }

      tasks.forEach(task => {
        const isDone = completed.has(task.id);
        const item = document.createElement("li");
        item.className = `task${isDone ? " done" : ""}`;

        const check = document.createElement("button");
        check.className = "check";
        check.type = "button";
        check.setAttribute("aria-label", isDone ? "取消完成" : "标记完成");
        check.textContent = isDone ? "✓" : "";
        check.addEventListener("click", () => {
          if (completed.has(task.id)) completed.delete(task.id);
          else completed.add(task.id);
          save();
          render();
        });

        const name = document.createElement("span");
        name.className = "task-name";
        name.textContent = task.name;

        const tag = document.createElement("span");
        tag.className = "tag";
        tag.dataset.category = task.category;
        tag.textContent = task.category;

        const remove = document.createElement("button");
        remove.className = "delete";
        remove.type = "button";
        remove.setAttribute("aria-label", `删除任务：${task.name}`);
        remove.title = "删除任务";
        remove.textContent = "×";
        remove.addEventListener("click", () => {
          tasks = tasks.filter(item => item.id !== task.id);
          completed.delete(task.id);
          save();
          render();
        });

        item.append(check, name, tag, remove);
        list.appendChild(item);
      });

      const doneCount = tasks.filter(task => completed.has(task.id)).length;
      const percent = tasks.length ? Math.round(doneCount / tasks.length * 100) : 0;
      document.getElementById("progressFill").style.width = `${percent}%`;
      document.getElementById("progressText").textContent =
        `${doneCount} / ${tasks.length}（${percent}%）`;

      const cheer = document.getElementById("cheer");
      if (tasks.length > 0 && doneCount === tasks.length) {
        cheer.textContent = "🎉 全部完成！今天的你超棒，给自己一个大大的赞！";
      } else if (doneCount > 0) {
        cheer.textContent = "✨ 很棒，已经完成一些啦，继续加油！";
      } else {
        cheer.textContent = "把想做的事情写下来，今天就从一小步开始吧！";
      }
    }

    document.getElementById("addForm").addEventListener("submit", event => {
      event.preventDefault();
      const input = document.getElementById("taskInput");
      const name = input.value.trim();
      if (!name) return;

      tasks.push({
        id: `${Date.now()}-${Math.random().toString(16).slice(2)}`,
        name,
        category: document.getElementById("categorySelect").value
      });

      input.value = "";
      save();
      render();
      input.focus();
    });

    render();
  </script>
</body>
</html>

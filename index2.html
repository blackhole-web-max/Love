<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>争上游 · 蜡笔牌局</title>
  <style>
    :root {
      --ink: #34343d;
      --red: #ef6d5b;
      --yellow: #ffd45c;
      --blue: #70bce7;
      --green: #78c995;
      --paper: #fffdf7;
      --muted: #85818a;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 24px 14px 42px;
      color: var(--ink);
      font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
      background-color: #fff8e9;
      background-image: radial-gradient(#e9d9c1 1px, transparent 1px);
      background-size: 19px 19px;
    }

    button, select { font: inherit; }

    button { color: inherit; }

    .app {
      width: min(100%, 850px);
      margin: 0 auto;
    }

    header {
      margin: 0 0 18px;
      text-align: center;
    }

    .badge {
      display: inline-block;
      padding: 6px 13px;
      border: 2px dashed #d7a936;
      border-radius: 999px;
      background: #fff0b8;
      color: #80651e;
      font-size: 13px;
      transform: rotate(-2deg);
    }

    h1 {
      margin: 12px 0 5px;
      font-size: clamp(30px, 7vw, 46px);
      letter-spacing: 3px;
      text-shadow: 2px 2px 0 #ffd45c;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }

    .panel {
      margin-bottom: 15px;
      padding: 17px;
      border: 3px solid var(--ink);
      border-radius: 22px 18px 23px 19px;
      background: var(--paper);
      box-shadow: 5px 5px 0 var(--ink);
    }

    .setup {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .setup label {
      display: flex;
      align-items: center;
      gap: 7px;
      color: #66616a;
      font-size: 14px;
    }

    select {
      height: 39px;
      padding: 0 10px;
      border: 2px solid #e7ddcd;
      border-radius: 11px;
      background: white;
      color: var(--ink);
    }

    .button {
      min-height: 40px;
      padding: 8px 15px;
      border: 2px solid var(--ink);
      border-radius: 12px 10px 13px 11px;
      background: var(--yellow);
      box-shadow: 3px 3px 0 var(--ink);
      cursor: pointer;
      font-weight: 800;
      transition: transform .12s, box-shadow .12s;
    }

    .button:hover { transform: translateY(-1px); }
    .button:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
    .button.primary { color: white; background: var(--red); }
    .button.blue { background: var(--blue); }
    .button:disabled { opacity: .45; cursor: not-allowed; transform: none; }

    .hint {
      width: 100%;
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
    }

    .players {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .player {
      min-height: 74px;
      padding: 11px;
      border: 2px solid #e8dfcf;
      border-radius: 15px;
      background: white;
    }

    .player.active {
      border-color: var(--red);
      background: #fff1ec;
      box-shadow: 0 0 0 2px #ef6d5b33;
    }

    .player-name {
      font-weight: 800;
      font-size: 14px;
    }

    .player-info {
      margin-top: 6px;
      color: var(--muted);
      font-size: 12px;
    }

    .game-info {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }

    .status {
      min-height: 24px;
      font-weight: 800;
    }

    .round-info {
      color: var(--muted);
      font-size: 13px;
    }

    .table-area {
      min-height: 150px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
      padding: 16px 10px;
      border: 2px dashed #e9dfce;
      border-radius: 18px;
      background: #fffaf0;
    }

    .table-empty {
      color: #aaa2a0;
      font-size: 14px;
    }

    .combo-label {
      width: 100%;
      color: #77727a;
      text-align: center;
      font-size: 13px;
    }

    .card {
      position: relative;
      width: 54px;
      height: 78px;
      flex: 0 0 54px;
      padding: 5px;
      border: 2px solid #e4dfd7;
      border-radius: 10px 8px 11px 9px;
      background: white;
      text-align: left;
      user-select: none;
    }

    .card.red { color: #e3564e; }
    .card.black { color: #34343d; }

    button.card {
      cursor: pointer;
      box-shadow: 1px 2px 0 #c7c0b4;
      transition: transform .12s, border-color .12s;
    }

    button.card:hover { transform: translateY(-4px); }
    button.card.selected {
      border-color: var(--red);
      outline: 2px solid #ef6d5b66;
      transform: translateY(-11px) rotate(-2deg);
    }

    .rank {
      display: block;
      font-size: 16px;
      font-weight: 900;
      line-height: 1;
    }

    .suit {
      display: block;
      margin-top: 5px;
      font-size: 19px;
      text-align: center;
    }

    .joker {
      padding-top: 8px;
      text-align: center;
      font-size: 11px;
      font-weight: 900;
    }

    .joker-symbol {
      display: block;
      margin-top: 3px;
      font-size: 24px;
    }

    .hand-area {
      margin-top: 18px;
    }

    .hand-title {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
      font-size: 14px;
      font-weight: 800;
    }

    .hand-title small {
      color: var(--muted);
      font-size: 12px;
      font-weight: 400;
    }

    .hand {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 7px;
      min-height: 86px;
      padding: 14px 5px 5px;
    }

    .actions {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 11px;
      margin-top: 12px;
    }

    .message {
      min-height: 22px;
      margin: 12px 0 0;
      color: #9b6b2c;
      text-align: center;
      font-size: 13px;
    }

    .empty-state {
      padding: 26px 10px;
      color: var(--muted);
      text-align: center;
      line-height: 1.8;
    }

    .overlay {
      position: fixed;
      z-index: 5;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #252334d9;
    }

    .overlay.show { display: flex; }

    .modal {
      width: min(100%, 360px);
      padding: 26px 22px;
      border: 3px solid var(--ink);
      border-radius: 22px;
      background: var(--paper);
      box-shadow: 7px 7px 0 var(--yellow);
      text-align: center;
    }

    .modal-icon { font-size: 42px; }
    .modal h2 { margin: 8px 0; }
    .modal p {
      margin: 8px 0 18px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
    }

    footer {
      margin-top: 17px;
      color: #958c7e;
      text-align: center;
      font-size: 12px;
    }

    @media (max-width: 570px) {
      body { padding: 18px 10px 30px; }
      .players { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .card { width: 47px; height: 70px; flex-basis: 47px; }
      .hand { gap: 5px; }
      .setup { gap: 8px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="badge">🖍️ 今天也来玩一局</div>
      <h1>争上游</h1>
      <p class="subtitle">先把手里的牌出完，就赢啦！</p>
    </header>

    <section class="panel setup">
      <label>
        总人数
        <select id="totalSelect">
          <option value="2">2 人</option>
          <option value="3" selected>3 人</option>
        </select>
      </label>

      <label>
        真人玩家
        <select id="humanSelect">
          <option value="1">1 人（和电脑玩）</option>
          <option value="2">2 人</option>
          <option value="3" selected>3 人</option>
        </select>
      </label>

      <button class="button primary" id="startButton">开始新一局</button>
      <p class="hint">
        多人同屏轮流玩：轮到下一位真人时，手牌会暂时隐藏。支持单张、对子、三张、三带一、三带二、顺子、连对、飞机、炸弹和王炸。
      </p>
    </section>

    <section class="panel" id="gamePanel">
      <div class="empty-state" id="emptyState">
        选择人数，点击“开始新一局”开始游戏。<br>
        牌局规则：必须出相同牌型且点数更大的牌，或者用炸弹压过。
      </div>

      <div id="gameView" hidden>
        <div class="players" id="players"></div>

        <div class="game-info" style="margin-top:16px">
          <div class="status" id="status"></div>
          <div class="round-info" id="roundInfo"></div>
        </div>

        <div class="table-area" id="tableArea"></div>

        <div class="hand-area">
          <div class="hand-title">
            <span id="handTitle">你的手牌</span>
            <small>点选要出的牌</small>
          </div>
          <div class="hand" id="hand"></div>
          <div class="actions">
            <button class="button primary" id="playButton">出牌</button>
            <button class="button blue" id="passButton">不要</button>
            <button class="button" id="sortButton">整理手牌</button>
          </div>
          <p class="message" id="message"></p>
        </div>
      </div>
    </section>

    <footer>一副牌，54 张 · 适合 2–3 人一起玩</footer>
  </main>

  <div class="overlay" id="handoff">
    <div class="modal">
      <div class="modal-icon">🙈</div>
      <h2 id="handoffTitle">轮到你啦</h2>
      <p>把设备交给下一位玩家。<br>准备好后再显示手牌。</p>
      <button class="button primary" id="revealButton">显示手牌</button>
    </div>
  </div>

  <script>
    const totalSelect = document.getElementById("totalSelect");
    const humanSelect = document.getElementById("humanSelect");
    const startButton = document.getElementById("startButton");
    const emptyState = document.getElementById("emptyState");
    const gameView = document.getElementById("gameView");
    const playersElement = document.getElementById("players");
    const tableArea = document.getElementById("tableArea");
    const handElement = document.getElementById("hand");
    const handTitle = document.getElementById("handTitle");
    const statusElement = document.getElementById("status");
    const roundInfo = document.getElementById("roundInfo");
    const messageElement = document.getElementById("message");
    const playButton = document.getElementById("playButton");
    const passButton = document.getElementById("passButton");
    const handoff = document.getElementById("handoff");
    const handoffTitle = document.getElementById("handoffTitle");

    const suits = [
      { symbol: "♠", color: "black" },
      { symbol: "♥", color: "red" },
      { symbol: "♣", color: "black" },
      { symbol: "♦", color: "red" }
    ];

    const rankLabels = {
      11: "J", 12: "Q", 13: "K", 14: "A", 15: "2"
    };

    let players = [];
    let current = 0;
    let selected = new Set();
    let lastMove = null;
    let lastPlayer = null;
    let passCount = 0;
    let winner = null;
    let locked = false;
    let aiPending = false;
    let nextCardId = 1;
    let roundNumber = 1;

    totalSelect.addEventListener("change", () => {
      const total = Number(totalSelect.value);
      [...humanSelect.options].forEach(option => {
        option.disabled = Number(option.value) > total;
      });
      if (Number(humanSelect.value) > total) humanSelect.value = String(total);
    });

    startButton.addEventListener("click", startGame);

    function makeDeck() {
      const deck = [];
      for (const suit of suits) {
        for (let rank = 3; rank <= 15; rank++) {
          deck.push({
            id: nextCardId++,
            rank,
            suit: suit.symbol,
            color: suit.color
          });
        }
      }
      deck.push({ id: nextCardId++, rank: 16, suit: "★", color: "red", joker: "小王" });
      deck.push({ id: nextCardId++, rank: 17, suit: "★", color: "black", joker: "大王" });
      return deck;
    }

    function shuffle(deck) {
      for (let i = deck.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [deck[i], deck[j]] = [deck[j], deck[i]];
      }
      return deck;
    }

    function startGame() {
      const total = Number(totalSelect.value);
      const humans = Number(humanSelect.value);
      nextCardId = 1;
      roundNumber = 1;

      players = [];
      for (let i = 0; i < humans; i++) {
        players.push({ name: `玩家 ${i + 1}`, kind: "human", hand: [] });
      }
      for (let i = humans; i < total; i++) {
        players.push({ name: `电脑 ${i - humans + 1}`, kind: "ai", hand: [] });
      }

      const deck = shuffle(makeDeck());
      deck.forEach((card, index) => players[index % total].hand.push(card));
      players.forEach(player => sortHand(player.hand));

      current = 0;
      selected = new Set();
      lastMove = null;
      lastPlayer = null;
      passCount = 0;
      winner = null;
      locked = players[current].kind === "human";
      aiPending = false;

      emptyState.hidden = true;
      gameView.hidden = false;
      handoff.classList.toggle("show", locked);
      if (locked) handoffTitle.textContent = `${players[current].name}，准备好了吗？`;
      render();
    }

    function sortHand(hand) {
      hand.sort((a, b) => a.rank - b.rank || suitOrder(a.suit) - suitOrder(b.suit));
    }

    function suitOrder(suit) {
      return { "♠": 0, "♥": 1, "♣": 2, "♦": 3, "★": 4 }[suit] ?? 5;
    }

    function rankText(rank) {
      return rankLabels[rank] || (rank === 16 ? "小王" : rank === 17 ? "大王" : String(rank));
    }

    function makeCardElement(card, selectable = false) {
      const element = document.createElement(selectable ? "button" : "div");
      element.className = `card ${card.color}`;
      if (selectable) {
        element.type = "button";
        element.classList.toggle("selected", selected.has(card.id));
        element.setAttribute("aria-label", card.joker || `${rankText(card.rank)}${card.suit}`);
        element.addEventListener("click", () => {
          if (selected.has(card.id)) selected.delete(card.id);
          else selected.add(card.id);
          render();
        });
      }

      if (card.joker) {
        element.innerHTML = `<div class="joker">${card.joker}<span class="joker-symbol">${card.suit}</span></div>`;
      } else {
        element.innerHTML = `<span class="rank">${rankText(card.rank)}</span><span class="suit">${card.suit}</span>`;
      }
      return element;
    }

    function render() {
      if (!players.length) return;

      playersElement.innerHTML = "";
      players.forEach((player, index) => {
        const box = document.createElement("div");
        box.className = `player${index === current && !winner ? " active" : ""}`;

        const name = document.createElement("div");
        name.className = "player-name";
        name.textContent = `${player.kind === "ai" ? "🤖 " : "🙂 "}${player.name}${index === current && !winner ? " · 出牌中" : ""}`;

        const info = document.createElement("div");
        info.className = "player-info";
        info.textContent = `剩余 ${player.hand.length} 张`;

        box.append(name, info);
        playersElement.appendChild(box);
      });

      statusElement.textContent = winner
        ? `🎉 ${players[winner].name} 获胜！`
        : players[current].kind === "ai"
          ? `${players[current].name} 正在思考…`
          : `轮到 ${players[current].name}`;

      roundInfo.textContent = `第 ${roundNumber} 轮`;
      renderTable();

      const activePlayer = players[current];
      const canShowHand = !winner && activePlayer.kind === "human" && !locked;
      handElement.innerHTML = "";
      handTitle.textContent = canShowHand ? `${activePlayer.name} 的手牌` : "当前手牌";

      if (canShowHand) {
        activePlayer.hand.forEach(card => handElement.appendChild(makeCardElement(card, true)));
      } else if (!winner && activePlayer.kind === "ai") {
        const note = document.createElement("div");
        note.className = "table-empty";
        note.textContent = "电脑的手牌是秘密 🤫";
        handElement.appendChild(note);
      } else if (winner) {
        const note = document.createElement("div");
        note.className = "table-empty";
        note.textContent = "本局结束啦，点击上方按钮再来一局！";
        handElement.appendChild(note);
      }

      playButton.disabled = !canShowHand;
      passButton.disabled = !canShowHand || !lastMove;
      document.getElementById("sortButton").disabled = !canShowHand;
      if (winner) {
        playButton.disabled = true;
        passButton.disabled = true;
      }
    }

    function renderTable() {
      tableArea.innerHTML = "";
      if (!lastMove) {
        const empty = document.createElement("div");
        empty.className = "table-empty";
        empty.textContent = "桌面空空的，出一手开启新一轮吧！";
        tableArea.appendChild(empty);
        return;
      }

      const label = document.createElement("div");
      label.className = "combo-label";
      label.textContent = `${players[lastPlayer].name} 出了：${comboName(lastMove)}`;
      tableArea.appendChild(label);
      lastMove.cards.forEach(card => tableArea.appendChild(makeCardElement(card)));
    }

    function classify(cards) {
      if (!cards.length) return null;
      const sorted = [...cards].sort((a, b) => a.rank - b.rank);
      const counts = new Map();
      sorted.forEach(card => counts.set(card.rank, (counts.get(card.rank) || 0) + 1));
      const values = [...counts.keys()].sort((a, b) => a - b);
      const amount = cards.length;

      if (amount === 2 && counts.has(16) && counts.has(17)) {
        return { type: "rocket", high: 17, count: amount, cards: sorted };
      }
      if (amount === 1) return { type: "single", high: sorted[0].rank, count: amount, cards: sorted };
      if (amount === 2 && values.length === 1) return { type: "pair", high: values[0], count: amount, cards: sorted };
      if (amount === 3 && values.length === 1) return { type: "triple", high: values[0], count: amount, cards: sorted };
      if (amount === 4 && values.length === 1) return { type: "bomb", high: values[0], count: amount, cards: sorted };

      const sortedCounts = [...counts.values()].sort((a, b) => a - b);
      if (amount === 4 && sortedCounts.join(",") === "1,3") {
        return { type: "tripleSingle", high: values.find(rank => counts.get(rank) === 3), count: amount, cards: sorted };
      }
      if (amount === 5 && sortedCounts.join(",") === "2,3") {
        return { type: "triplePair", high: values.find(rank => counts.get(rank) === 3), count: amount, cards: sorted };
      }

      const consecutive = values.every((rank, index) => index === 0 || rank === values[index - 1] + 1);
      if (!values.some(rank => rank > 14) && consecutive) {
        if (values.length >= 5 && sortedCounts.every(count => count === 1)) {
          return { type: "straight", high: values[values.length - 1], count: amount, cards: sorted };
        }
        if (values.length >= 3 && sortedCounts.every(count => count === 2)) {
          return { type: "pairRun", high: values[values.length - 1], count: amount, cards: sorted };
        }
        if (values.length >= 2 && sortedCounts.every(count => count === 3)) {
          return { type: "tripleRun", high: values[values.length - 1], count: amount, cards: sorted };
        }
      }
      return null;
    }

    function comboName(move) {
      const names = {
        single: "单张", pair: "对子", triple: "三张",
        tripleSingle: "三带一", triplePair: "三带二",
        straight: "顺子", pairRun: "连对", tripleRun: "飞机",
        bomb: "炸弹", rocket: "王炸"
      };
      return names[move.type] || "牌";
    }

    function beats(move, target) {
      if (!target) return true;
      if (move.type === "rocket") return true;
      if (target.type === "rocket") return false;
      if (move.type === "bomb" && target.type !== "bomb") return true;
      if (move.type !== target.type || move.count !== target.count) return false;
      return move.high > target.high;
    }

    function combinations(hand) {
      const byRank = new Map();
      hand.forEach(card => {
        if (!byRank.has(card.rank)) byRank.set(card.rank, []);
        byRank.get(card.rank).push(card);
      });

      const result = [];
      const add = cards => {
        const move = classify(cards);
        if (move) result.push(move);
      };

      hand.forEach(card => add([card]));
      for (const [rank, cards] of byRank) {
        if (cards.length >= 2) add(cards.slice(0, 2));
        if (cards.length >= 3) add(cards.slice(0, 3));
        if (cards.length >= 4) add(cards.slice(0, 4));

        if (cards.length >= 3) {
          for (const [otherRank, otherCards] of byRank) {
            if (otherRank !== rank && otherCards.length >= 1) {
              add([...cards.slice(0, 3), otherCards[0]]);
            }
            if (otherRank !== rank && otherCards.length >= 2) {
              add([...cards.slice(0, 3), ...otherCards.slice(0, 2)]);
            }
          }
        }
      }

      addSequences(byRank, result, 1, 5, "straight");
      addSequences(byRank, result, 2, 3, "pairRun");
      addSequences(byRank, result, 3, 2, "tripleRun");

      const smallJoker = byRank.get(16);
      const bigJoker = byRank.get(17);
      if (smallJoker && bigJoker) add([smallJoker[0], bigJoker[0]]);

      return result;
    }

    function addSequences(byRank, result, groupSize, minimumLength, expectedType) {
      for (let start = 3; start <= 14 - minimumLength + 1; start++) {
        for (let end = start + minimumLength - 1; end <= 14; end++) {
          const cards = [];
          let valid = true;
          for (let rank = start; rank <= end; rank++) {
            const group = byRank.get(rank);
            if (!group || group.length < groupSize) {
              valid = false;
              break;
            }
            cards.push(...group.slice(0, groupSize));
          }
          if (valid) {
            const move = classify(cards);
            if (move && move.type === expectedType) result.push(move);
          }
        }
      }
    }

    function playSelected() {
      if (!players.length || winner || locked || players[current].kind !== "human") return;
      const player = players[current];
      const chosen = player.hand.filter(card => selected.has(card.id));
      const move = classify(chosen);

      if (!move) {
        messageElement.textContent = "这几张牌不是有效牌型，再试试看～";
        return;
      }
      if (!beats(move, lastMove)) {
        messageElement.textContent = "要出相同牌型中更大的牌，或者出炸弹哦。";
        return;
      }

      applyMove(move);
    }

    function applyMove(move) {
      const player = players[current];
      const usedIds = new Set(move.cards.map(card => card.id));
      player.hand = player.hand.filter(card => !usedIds.has(card.id));
      selected.clear();
      lastMove = move;
      lastPlayer = current;
      passCount = 0;
      roundNumber++;

      if (player.hand.length === 0) {
        winner = current;
        locked = false;
        handoff.classList.remove("show");
        render();
        return;
      }
      advanceTurn();
    }

    function passTurn() {
      if (!players.length || winner || locked || !lastMove) return;
      passCount++;
      selected.clear();

      if (passCount >= players.length - 1) {
        current = lastPlayer;
        lastMove = null;
        passCount = 0;
        messageElement.textContent = "其他玩家都不要，这一轮由上家重新出牌。";
        beginCurrentTurn();
        return;
      }
      advanceTurn();
    }

    function advanceTurn() {
      current = (current + 1) % players.length;
      beginCurrentTurn();
    }

    function beginCurrentTurn() {
      selected.clear();
      messageElement.textContent = "";
      locked = players[current].kind === "human";
      handoff.classList.toggle("show", locked);
      if (locked) handoffTitle.textContent = `轮到 ${players[current].name} 了`;
      render();

      if (players[current].kind === "ai" && !winner) {
        scheduleAiTurn();
      }
    }

    function scheduleAiTurn() {
      if (aiPending) return;
      aiPending = true;
      setTimeout(() => {
        aiPending = false;
        if (winner || !players.length || players[current].kind !== "ai") return;
        const hand = players[current].hand;
        const moves = combinations(hand);
        let choice;

        if (lastMove) {
          const sameType = moves
            .filter(move => move.type !== "bomb" && move.type !== "rocket" && beats(move, lastMove))
            .sort((a, b) => a.high - b.high);
          const bombs = moves
            .filter(move => (move.type === "bomb" || move.type === "rocket") && beats(move, lastMove))
            .sort((a, b) => a.high - b.high);

          choice = sameType[0] || bombs[0];
          if (!choice) {
            passTurn();
            return;
          }
        } else {
          const singles = moves
            .filter(move => move.type === "single")
            .sort((a, b) => a.high - b.high);
          choice = singles[0] || moves[0];
        }
        applyMove(choice);
      }, 750);
    }

    playButton.addEventListener("click", playSelected);
    passButton.addEventListener("click", passTurn);

    document.getElementById("sortButton").addEventListener("click", () => {
      if (players[current]?.kind !== "human" || locked) return;
      sortHand(players[current].hand);
      render();
    });

    document.getElementById("revealButton").addEventListener("click", () => {
      locked = false;
      handoff.classList.remove("show");
      render();
    });

    render();
  </script>
</body>

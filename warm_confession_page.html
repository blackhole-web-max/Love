    position:fixed;

      radial-gradient(circle at 30% 60%,rgba(255,255,255,.5) 0 1px,transparent 1.5px),

    background-size:28px 28px, 34px 34px;
    opacity:.35;
    pointer-events:none;
  }

  .page{
    position:relative;
    width:100%;
    height:100%;
    display:grid;
    place-items:center;
    padding:24px;
  }

  .card{
    position:relative;
    width:min(92vw,620px);
    min-height:440px;
    padding:42px 28px 30px;
    border-radius:34px;
    background:rgba(255,250,244,.76);
    border:1px solid rgba(255,255,255,.8);
    box-shadow:

      inset 0 1px 0 rgba(255,255,255,.9);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    text-align:center;
    overflow:hidden;
  }

  .glow{
    position:absolute;
    width:220px;
    height:220px;
    border-radius:50%;
    filter:blur(18px);
    background:rgba(255,187,126,.26);
    top:-80px;
    right:-60px;
  }

  .tiny{
    font-size:14px;
    letter-spacing:.18em;
    color:#bb7664;
    margin-bottom:18px;
  }

  h1{
    margin:0;
    font-size:clamp(34px,8vw,58px);
    line-height:1.15;
    color:#8d4a3a;
    font-weight:800;
  }

  .subtitle{
    margin:18px auto 0;
    max-width:470px;
    color:#9a675b;
    line-height:1.9;
    font-size:16px;
  }

  .heart{
    width:82px;
    height:82px;
    margin:28px auto 20px;
    position:relative;
    transform:rotate(45deg);
    background:linear-gradient(135deg,#ff9d7e,#ef6f61);
    border-radius:18px;
    box-shadow:0 12px 28px rgba(229,102,82,.28);
    animation:beat 1.6s ease-in-out infinite;
  }

  .heart::before,.heart::after{
    content:"";
    position:absolute;
    width:82px;
    height:82px;
    border-radius:50%;
    background:inherit;
  }
  .heart::before{left:-41px}
  .heart::after{top:-41px}

  @keyframes beat{
    0%,100%{transform:rotate(45deg) scale(1)}
    50%{transform:rotate(45deg) scale(1.08)}
  }

  .message{
    min-height:90px;
    font-size:18px;
    line-height:1.9;
    color:#6f463d;
    margin:8px auto 18px;
    max-width:470px;
    transition:.35s ease;
  }

  button{
    border:none;
    border-radius:999px;
    padding:14px 24px;
    font-size:16px;
    font-weight:700;
    color:#fffaf6;
    background:linear-gradient(135deg,#ef8f70,#e46c60);
    box-shadow:0 10px 24px rgba(213,101,81,.25);
    cursor:pointer;
    transition:.2s ease;
  }
  button:active{transform:scale(.96)}

  .small-note{
    margin-top:14px;
    font-size:12px;
    color:#b88679;
  }

  .floating-heart{
    position:fixed;
    left:0;
    top:100vh;
    pointer-events:none;
    opacity:0;
    animation:floatUp linear forwards;
    filter:drop-shadow(0 6px 8px rgba(183,90,70,.12));
  }

  @keyframes floatUp{
    0%{
      transform:translate3d(var(--x),0,0) scale(.7) rotate(0deg);
      opacity:0;
    }
    10%{opacity:.55}
    100%{
      transform:translate3d(calc(var(--x) + var(--drift)),-115vh,0) scale(1.25) rotate(18deg);
      opacity:0;
    }
  }

  .signature{
    margin-top:20px;
    color:#a15c4c;
    font-size:15px;
  }

  @media(max-height:620px){
    .card{min-height:auto;padding-top:26px}
    .heart{width:60px;height:60px;margin:18px auto}
    .heart::before,.heart::after{width:60px;height:60px}
    .heart::before{left:-30px}
    .heart::after{top:-30px}
  }
</style>

<body>
<div class="page">
  <div class="card">
    <div class="glow"></div>
    <div class="tiny">TO SOMEONE SPECIAL</div>
    <h1>有句话，想认真告诉你</h1>

    <p class="subtitle">
      我想了很久，还是觉得有些心意不该只放在心里。
    </p>

    <div class="heart"></div>

    <div class="message" id="message">
      和你相处的每一个普通瞬间，<br>
      都会让我觉得今天比昨天更值得期待。
    </div>

    <button id="nextBtn">继续看下去</button>

    <div class="signature">
      —— 来自一个很在意你的人
    </div>

    <div class="small-note">没有音乐，只有想对你说的话。</div>
  </div>
</div>

<script>
const lines = [
  `和你相处的每一个普通瞬间，<br>都会让我觉得今天比昨天更值得期待。`,
  `我喜欢你笑起来的样子，<br>也喜欢你认真说话时的样子。`,
  `喜欢这件事并不是突然发生的，<br>而是在一次次想起你的时候慢慢变得确定。`,
  `所以今天，我想把这句话认真地告诉你：`,
  `<span style="font-size:30px;font-weight:800;color:#d85f52">我喜欢你。</span><br>如果可以，我想陪你走很久很久。`
];

let index = 0;
const msg = document.getElementById('message');
const btn = document.getElementById('nextBtn');

btn.addEventListener('click', () => {
  index++;
  if(index >= lines.length) index = lines.length - 1;

  msg.style.opacity = 0;
  msg.style.transform = 'translateY(8px)';

  setTimeout(() => {
    msg.innerHTML = lines[index];
    msg.style.opacity = 1;
    msg.style.transform = 'translateY(0)';
  }, 220);

  if(index === lines.length - 1){
    btn.textContent = '❤️';
    burstHearts(18);
  }
});

function createHeart(){
  const el = document.createElement('div');
  el.className = 'floating-heart';
  el.textContent = Math.random() > .5 ? '❤' : '♡';
  el.style.color = Math.random() > .5 ? '#ef8f70' : '#f2ad8d';
  el.style.fontSize = (14 + Math.random()*22) + 'px';
  el.style.setProperty('--x', (Math.random()*100) + 'vw');
  el.style.setProperty('--drift', ((Math.random()-.5)*120) + 'px');
  el.style.animationDuration = (5 + Math.random()*5) + 's';
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),10000);
}

function burstHearts(n){
  for(let i=0;i<n;i++){
    setTimeout(createHeart,i*80);
  }
}

setInterval(()=>{
  if(document.hidden) return;
  createHeart();
}, 1100);
</script>
